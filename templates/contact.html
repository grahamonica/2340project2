<!-- templates/contact.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact the Developers</title>
    <style>
        /* General styling */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #FFFFFF;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            flex-direction: column;
        }

        /* Title styling */
        h1 {
            font-size: 2.5em;
            font-weight: bold;
            color: #1DB954; /* Spotify Green */
            margin-bottom: 0.5em;
        }

        /* Description styling */
        p {
            font-size: 1.1em;
            color: #b3b3b3; /* Light grey */
            max-width: 600px;
            margin-bottom: 1em;
            line-height: 1.5em;
        }

        /* Form styling */
        form {
            display: flex;
            flex-direction: column;
            width: 300px;
            max-width: 80%;
        }

        /* Input and textarea styling */
        input[type="text"],
        input[type="email"],
        textarea {
            background-color: #282828;
            color: #FFFFFF;
            border: 1px solid #1DB954;
            border-radius: 5px;
            padding: 0.8em;
            margin-bottom: 1em;
            font-size: 1em;
            resize: vertical;
        }

        /* Button styling */
        .btn {
            background-color: #1DB954; /* Spotify Green */
            color: #FFFFFF;
            padding: 0.8em;
            font-size: 1em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 0.5em;
        }

        .btn:hover {
            background-color: #14833b; /* Darker green for hover effect */
        }
    </style>
</head>
<body>
    <h1>Contact the Developers</h1>
    <p>If you have any questions, suggestions, or feedback, feel free to reach out to us. We’d love to hear from you!</p>
    
    <!-- Contact Form -->
    <form action="{% url 'contact' %}" method="post">
        {% csrf_token %}
        <input type="text" name="name" placeholder="Your Name" required>
        <input type="email" name="email" placeholder="Your Email" required>
        <textarea name="message" placeholder="Your Message" rows="5" required></textarea>
        <button type="submit" class="btn">Send Message</button>
    </form>
</body>
</html>
