{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<style>
    .content {
        margin-top: 80px;
        padding: 40px;
        text-align: center;
    }

    .content h2 {
        font-size: 2.5em; /* Large modern font */
        font-weight: bold;
        margin-bottom: 20px;
    }

    .content p {
        font-size: 1.2em; /* Larger text for readability */
        line-height: 1.8em; /* Extra spacing between lines */
        margin-bottom: 30px;
        color: #b3b3b3; /* Light gray for subtle contrast */
    }

    .btn {
        background-color: #1DB954;
        color: #FFFFFF;
        padding: 15px 30px;
        font-size: 1.2em; /* Larger button text */
        border: none;
        border-radius: 50px;
        cursor: pointer;
        text-decoration: none;
        transition: background-color 0.3s;
    }

    .btn:hover {
        background-color: #14833b; /* Darker green for hover */
    }
</style>
<body class="dark-mode">
    <!-- Fixed Header -->
    <div class="header">
        <div class="nav-links">
            <a href="{% url 'spotify_social' %}" class="nav-link">Spotify Social</a>
            <a href="{% url 'contact' %}" class="nav-link">Contact</a>
            <a href="{% url 'account_info' %}" class="nav-link">Account Info</a>
            <a href="{% url 'logout' %}" class="nav-link">Logout</a>
        </div>
        <div class="dropdown">
            <button class="dropdown-toggle">Select Theme</button>
            <div class="dropdown-menu">
                <button id="toggle-dark-light">Light/Dark Mode</button>
                <button id="toggle-christmas">Christmas Theme</button>
                <button id="toggle-halloween">Halloween Theme</button>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="content">
        <h2>Thank You!</h2>
        <p>Your message has been received. Our team will get back to you as soon as possible.</p>

        <!-- Link back to the home page -->
        <a href="{% url 'home' %}" class="btn">Return to Home</a>
    </div>

    <!-- JavaScript -->
    <script src="{% static 'js/theme.js' %}"></script>
</body>
</html>
