<!-- templates/thank_you.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You</title>
    <style>
        /* General styling */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #FFFFFF;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            flex-direction: column;
        }

        /* Title styling */
        h1 {
            font-size: 2.5em;
            font-weight: bold;
            color: #1DB954; /* Spotify Green */
            margin-bottom: 0.5em;
        }

        /* Message styling */
        p {
            font-size: 1.2em;
            color: #b3b3b3; /* Light grey */
            max-width: 600px;
            line-height: 1.5em;
            margin-bottom: 1.5em;
        }

        /* Button styling */
        .btn {
            background-color: #1DB954; /* Spotify Green */
            color: #FFFFFF;
            padding: 0.8em 1.5em;
            font-size: 1em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: #14833b; /* Darker green for hover effect */
        }
    </style>
</head>
<body>
    <h1>Thank You!</h1>
    <p>Your message has been received. Our team will get back to you as soon as possible.</p>
    
    <!-- Link back to the home page -->
    <a href="{% url 'home' %}" class="btn">Return to Home</a>
</body>
</html>
