{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Georgia Tech Wrapped - Login</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <!-- Dark/Light Mode Toggle Button -->
    <button id="toggle-mode" class="toggle-mode-button" onclick="toggleMode()">Switch to Dark Mode</button>

    <div class="login-container">
        <div class="login-box">
            <h1 class="login-title">Welcome to Georgia Tech Wrapped!</h1>
            <p class="login-subtitle">Your Year, Your Data. Log in to explore your personalized insights!</p>

            <!-- Login Form -->
            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="login-button">Log In</button>
            </form>

            <!-- Sign-Up Link -->
            <p class="signup-link">
                Don’t have an account? <a href="{% url 'signup' %}">Sign up here</a>
            </p>

            <!-- Footer -->
            <div class="footer">
                <p>© 2024 Georgia Tech Wrapped. All rights reserved.</p>
            </div>
        </div>
    </div>

    <!-- JavaScript for theme toggling -->
    <script src="{% static 'js/theme.js' %}"></script>
</body>
</html>
