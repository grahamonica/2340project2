{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Georgia Tech Wrapped - Sign Up</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <!-- Dark/Light Mode Toggle Button -->
    <button id="toggle-mode" class="toggle-mode-button" onclick="toggleMode()">Switch to Dark Mode</button>

    <div class="signup-container">
        <div class="signup-box">
            <h1 class="signup-title">Join Georgia Tech Wrapped</h1>
            <p class="signup-subtitle">Create your account to see your personalized wrap-up experience!</p>

            <!-- Signup Form -->
            <form method="post" action="{% url 'signup' %}">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="signup-button">Sign Up</button>
            </form>

            <!-- Login Link -->
            <p class="login-link">
                Already have an account? <a href="{% url 'login' %}">Log in here</a>
            </p>

            <!-- Footer -->
            <div class="footer">
                <p>© 2024 Georgia Tech Wrapped. All rights reserved.</p>
            </div>
        </div>
    </div>

    <!-- JavaScript for theme toggling -->
    <script src="{% static 'js/theme.js' %}"></script>
</body>
</html>
